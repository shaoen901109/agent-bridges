[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchup-bridge"
version = "1.0.0"
description = "SketchUp 代理操控插件 — 共用 client / MCP server / CLI"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pillow>=10.0.0",
]

[project.scripts]
sketchup-bridge = "sketchup_bridge.cli:main"
sketchup-bridge-mcp = "sketchup_bridge.mcp_server:main"

[tool.setuptools.packages.find]
include = ["sketchup_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
